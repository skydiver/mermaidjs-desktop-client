[package]
name = "mermaidjs_desktop_client"
version = "3.1.1"
description = "Desktop editor for Mermaid diagrams with real-time preview, syntax highlighting, and SVG/PNG export."
authors = ["Martin M."]
edition = "2021"

[lib]
name = "mermaidjs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-text = "20"
