[package]
name = "mermaidjs_desktop_client"
version = "4.0.0"
description = "Desktop editor for Mermaid diagrams with real-time preview, syntax highlighting, and SVG/PNG export."
authors = ["Martin M."]
edition = "2021"

[lib]
name = "mermaidjs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI provider layer (src/ai/, commands/ai.rs): rustls avoids a system
# OpenSSL dependency across the three desktop targets. `stream` is needed
# for `bytes_stream()` on SSE/NDJSON provider responses.
reqwest = { version = "0.13", features = ["json", "stream", "rustls"], default-features = false }
# `macros` (for `#[tokio::test]`) and `rt` (a runtime for those tests to
# run on) are additions beyond the original brief's list, needed only for
# the AI layer's unit tests — see ai/sse.rs's `open_sse` tests.
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7"
futures = "0.3"
bytes = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-text = "20"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
