<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MermaidJS Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="app-header" role="banner">
        <div class="toolbar">
          <div class="toolbar-left">
            <button type="button" class="toolbar-button" disabled>
              New Diagram
            </button>
            <button type="button" class="toolbar-button" disabled>
              Open…
            </button>
            <button type="button" class="toolbar-button" disabled>
              Save
            </button>
          </div>
          <div class="toolbar-right"></div>
        </div>
      </header>

      <main class="app-main">
        <section class="panel placeholder">
          <h2>Editor</h2>
          <label class="field-label" for="editor-host">Mermaid source</label>
          <div
            id="editor-host"
            class="editor-host"
            role="textbox"
            aria-label="Mermaid source editor"
          >
            <noscript>
              <textarea class="editor-fallback" spellcheck="false">
graph TD
    A[Start] --> B{Is it working?}
    B -- Yes --> C[Great!]
    B -- Not yet --> D[Keep iterating]</textarea
            >
            </noscript>
          </div>
        </section>
        <section class="panel placeholder">
          <h2>Preview</h2>
          <div
            id="preview-host"
            class="preview-host preview-empty"
            aria-live="polite"
            role="status"
          >
            <p class="preview-message">Rendered diagram will appear here.</p>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span>Status: ready for the next steps.</span>
      </footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
