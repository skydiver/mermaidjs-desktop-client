<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MermaidJS Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="app-header" role="banner">
        <div class="toolbar">
          <div class="toolbar-left">
            <button
              type="button"
              class="toolbar-button icon-button"
              aria-label="New diagram"
              data-action="new-diagram"
              data-tooltip="New diagram"
            >
              <i class="ri-file-add-line" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="toolbar-button icon-button"
              aria-label="Open diagram"
              data-action="open-diagram"
              data-tooltip="Open…"
            >
              <i class="ri-folder-open-line" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="toolbar-button icon-button"
              aria-label="Save diagram"
              data-action="save-diagram"
              data-tooltip="Save"
            >
              <i class="ri-save-3-line" aria-hidden="true"></i>
            </button>
          </div>
          <div class="toolbar-right"></div>
        </div>
      </header>

      <main class="app-main">
        <section class="panel editor-panel">
          <div
            id="editor-host"
            class="editor-host"
            role="textbox"
            aria-label="Mermaid source editor"
          >
            <noscript>
              <textarea class="editor-fallback" spellcheck="false">
graph TD
    A[Start] --> B{Is it working?}
    B -- Yes --> C[Great!]
    B -- Not yet --> D[Keep iterating]</textarea
            >
            </noscript>
          </div>
        </section>
        <section class="panel preview-panel">
          <div
            id="preview-host"
            class="preview-host preview-empty"
            aria-live="polite"
            role="status"
          >
            <p class="preview-message">Rendered diagram will appear here.</p>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span>Status: ready for the next steps.</span>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
